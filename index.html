<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="OIM3690 Web Development — course work and session demos." />
  <title>OIM3690 | Viraj Shah</title>
  <style>
    :root {
      --bg: #1a2744;
      --panel: rgba(232, 224, 212, 0.08);
      --panel-strong: rgba(232, 224, 212, 0.12);
      --text: rgba(245, 240, 232, 0.95);
      --muted: rgba(245, 240, 232, 0.72);
      --border: rgba(232, 224, 212, 0.18);
      --accent: #2563eb;
      --accent2: #60a5fa;
      --radius: 16px;
      --max: 980px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .container { max-width: var(--max); width: 100%; text-align: center; }
    h1 { margin: 0 0 8px 0; font-size: 1.75rem; }
    p { margin: 0 0 24px 0; color: var(--muted); }
    a {
      display: inline-block;
      padding: 12px 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s;
    }
    a:hover { background: var(--panel-strong); border-color: var(--accent); }
  </style>
</head>
<body>
  <div class="container">
    <h1>OIM3690 Web Development</h1>
    <p>Course work and session demos — Viraj Shah</p>
    <a href="course.html">Go to Course Work →</a>
  </div>
</body>
</html>
