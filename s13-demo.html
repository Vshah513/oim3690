<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Session 13 Demo | OIM3690 - Viraj Shah</title>
  <style>
    :root {
      --bg: #1a2744;
      --panel: rgba(232, 224, 212, 0.08);
      --panel-strong: rgba(232, 224, 212, 0.12);
      --text: rgba(245, 240, 232, 0.95);
      --muted: rgba(245, 240, 232, 0.72);
      --border: rgba(232, 224, 212, 0.18);
      --accent: #2563eb;
      --accent2: #60a5fa;
      --radius: 16px;
      --max: 980px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.6;
    }
    .container { max-width: var(--max); margin: 0 auto; padding: 24px; }
    .nav {
      position: sticky; top: 0; z-index: 50;
      backdrop-filter: blur(12px);
      background: color-mix(in srgb, var(--bg) 85%, transparent);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 24px; max-width: var(--max); margin: 0 auto;
    }
    .back-link {
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      font-size: 0.9rem;
      transition: background 0.2s, border-color 0.2s;
    }
    .back-link:hover { background: var(--panel-strong); border-color: var(--accent); }
    main { padding: 32px 0; }
    .session-header { margin-bottom: 28px; }
    .session-header h1 { margin: 0 0 8px 0; font-size: 1.75rem; }
    .session-header p { margin: 0; color: var(--muted); font-size: 1rem; }
    .demo-content {
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: var(--radius);
      padding: 28px;
      min-height: 200px;
    }
    .demo-content p { margin: 0; color: var(--muted); }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a class="back-link" href="course.html">← Back to Course Work</a>
      <span style="color: var(--muted); font-size: 0.9rem;">Session 13</span>
    </div>
  </nav>
  <div class="container">
    <main>
      <header class="session-header">
        <h1>Session 13 Demo</h1>
        <p>What I learned in this session — demo and notes for instructor review.</p>
      </header>
      <div class="demo-content">
        <p>Demo content will be added based on what we covered in this session.</p>
      </div>
    </main>
  </div>
</body>
</html>
